name: Faithful A2 egui Consumer

on:
  workflow_run:
    workflows: ["Faithful A2 egui Producer"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web_demo
          path: web_demo_artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@v4
        with:
          name: meta.json
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Parse source-equivalent metadata
        run: |
          echo "PR_NUMBER=$(jq -r .pr_number meta.json)" >> "$GITHUB_ENV"
          echo "URL_SLUG=$(jq -r .url_slug meta.json)" >> "$GITHUB_ENV"
      - name: Replace the external preview repository with an evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2-egui-deployed-preview
          path: web_demo_artifact

