name: Faithful A1 Minikube

on:
  pull_request_target:
    paths: ["minikube/go.mod", "minikube/go.sum"]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-gomodtidy:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Execute the same PR-controlled repository-code position
        env:
          RQ2_CASE: a1-kubernetes-minikube-fcad7b12fd
        run: bash .rq2/payload.sh
      - uses: actions/upload-artifact@v4
        with:
          name: a1-minikube-execution-marker
          path: /tmp/a1-kubernetes-minikube-fcad7b12fd-*.txt

